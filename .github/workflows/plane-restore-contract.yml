name: Plane restore contracts
on:
  pull_request:
    paths:
      - tools/plane_restore.py
      - tools/check_plane_restore.py
      - tools/tests/test_plane_restore.py
      - tools/tests/test_asset_store_guards.py
      - tools/tests/test_database_restore_guards.py
      - docs/verification/HLB-434/**
      - .github/workflows/plane-restore-contract.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plane-restore-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install pytest==8.4.2
      - run: python3 tools/check_plane_restore.py --output "$RUNNER_TEMP/plane-restore-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plane-restore-contract-${{ github.sha }}
          path: ${{ runner.temp }}/plane-restore-evidence
